<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciencuadras | Zona privada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Nota: la fuente oficial de Ciencuadras se sirve con CORS restringido y no puede
       cargarse desde otro origen. Usamos Montserrat como equivalente visual cercano. -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Ciencuadras Design System tokens - segurosbolivar/ciencuadras-monorepo-mf
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cc: {
              primary:  '#097AB2', p600: '#006098', p700: '#004A80', navy: '#00204D',
              blue: '#3E98CC', blueSoft: '#EAF7FF', green: '#53A532', green600: '#3B8D24', green700: '#277619',
              amber: '#FF9D21', red: '#DC0A0A',
              g700: '#434F5B', g600: '#5D6F7E', g500: '#7B8F9D', g400: '#9EADB7', g300: '#BFC9CF',
              g200: '#DFE4E7', g100: '#F0F3F4', zpBg: '#F7FAFC', zpSide: '#F4F8FB', zpBanner: '#F0F5FA'
            }
          },
          fontFamily: { sans: ['Ciencuadras', 'Montserrat', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Montserrat', 'Ciencuadras', sans-serif; color: #434F5B; }
    .cc-header { box-shadow: 1px 4px 8px rgba(41,48,56,0.16); }
    .top-link { color: #414141; font-size: 14px; }
    .top-link:hover { color: #097AB2; }
    /* sidebar item */
    .zp-menu-item { transition: background .15s, color .15s; color: #5D6F7E; }
    .zp-menu-item:hover { background: #EAF7FF; color: #097AB2; }
    .zp-menu-item.active { color: #097AB2; font-weight: 600; }
    .zp-menu-item.active .zp-menu-ico { color: #097AB2; }
    .view { display: none; }
    .view.active { display: block; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .card { transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.06); }
    .score-ring { transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
    input[type=range].cc-range { -webkit-appearance:none; height:6px; border-radius:9999px; background:#DFE4E7; outline:none; }
    input[type=range].cc-range::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#097AB2; border:3px solid #FF9D21; cursor:pointer; }
    input[type=range].cc-range::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#097AB2; border:3px solid #FF9D21; cursor:pointer; }
    .toast { animation: toastIn .3s ease; }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    .ia-tab.active { color: #097AB2; border-bottom-color: #097AB2; }
    .ia-tab { border-bottom: 2px solid transparent; }
    /* pestana lateral "Resuelve tus dudas" */
    .dudas-tab { writing-mode: vertical-rl; }
  </style>
</head>
<body class="bg-white min-h-screen">

  <!-- ===== HEADER GLOBAL (barra blanca con menu horizontal) ===== -->
  <header class="cc-header bg-white sticky top-0 z-30">
    <div class="max-w-[1285px] mx-auto px-4 md:px-10 h-[60px] flex items-center gap-6">
      <button id="menuBtn" class="lg:hidden text-cc-g700 p-1" aria-label="Abrir menu"><i class="fa-solid fa-bars text-xl"></i></button>
      <!-- logo real Ciencuadras -->
      <a href="#" class="flex items-center select-none flex-shrink-0">
        <img src="https://www.ciencuadras.com/sources/images/logo-cc-color.svg" alt="Ciencuadras" width="144" height="29" class="h-[30px] w-auto" />
      </a>
      <!-- menu horizontal -->
      <nav class="hidden lg:flex items-center gap-7 flex-1 justify-center">
        <a class="top-link" href="#">Compra</a>
        <a class="top-link" href="#">Arriendo</a>
        <a class="top-link inline-flex items-center gap-1" href="#">Vender <i class="fa-solid fa-angle-down text-[11px]"></i></a>
        <a class="top-link inline-flex items-center gap-1" href="#">Tramites y servicios <i class="fa-solid fa-angle-down text-[11px]"></i></a>
        <a class="top-link" href="#">Exterior</a>
      </nav>
      <!-- acciones derecha -->
      <div class="flex items-center gap-4 ml-auto lg:ml-0">
        <button class="relative text-cc-primary" aria-label="Carrito"><i class="fa-solid fa-cart-shopping text-lg"></i></button>
        <div class="w-[35px] h-[35px] rounded-full flex items-center justify-center text-xs font-bold text-white" style="background:#3E98CC">IC</div>
        <button class="inline-flex items-center gap-2 text-sm font-semibold text-white h-10 px-4 rounded-[24px]" style="background:#53A532">Publicar <i class="fa-solid fa-bag-shopping"></i></button>
      </div>
    </div>
  </header>

  <!-- ===== BARRA "Mi zona privada" + buscador ===== -->
  <div class="bg-cc-zpBg border-b border-cc-g200">
    <div class="max-w-[1285px] mx-auto px-4 md:px-10 py-4 flex items-center justify-between gap-4 flex-wrap">
      <h1 class="text-2xl font-light text-cc-g600">Mi zona privada</h1>
      <div class="flex items-center gap-2 flex-wrap">
        <input class="text-sm bg-white border border-cc-g200 rounded-lg px-3 py-2 w-36 focus:outline-none focus:border-cc-primary placeholder:text-cc-g400" placeholder="Codigo">
        <div class="relative">
          <select class="text-sm bg-white border border-cc-g200 rounded-lg pl-3 pr-8 py-2 w-44 appearance-none focus:outline-none focus:border-cc-primary text-cc-g500">
            <option>Tipo Transaccion</option><option>Arriendo</option><option>Venta</option>
          </select>
          <i class="fa-solid fa-chevron-down text-[10px] text-cc-g400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>
        <input class="text-sm bg-white border border-cc-g200 rounded-lg px-3 py-2 w-40 focus:outline-none focus:border-cc-primary placeholder:text-cc-g400" placeholder="Ciudad">
        <button class="text-cc-g400 hover:text-cc-primary px-1" title="Limpiar"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="text-sm font-semibold px-5 py-2 rounded-full bg-cc-primary hover:bg-cc-p600 text-white">Buscar</button>
      </div>
    </div>
  </div>

  <!-- ===== CONTENT: sidebar + main + banner ===== -->
  <div class="max-w-[1285px] mx-auto flex bg-white">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-white border-r border-cc-g200 w-56 flex-shrink-0 fixed lg:sticky top-16 lg:top-0 z-20 h-[calc(100vh-4rem)] lg:h-auto lg:min-h-[70vh] -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto">
      <nav class="py-4">
        <button data-view="leads" class="zp-menu-item w-full text-left px-5 py-3 text-sm flex items-center gap-3">
          <span class="zp-menu-ico w-5 text-center text-cc-g400"><i class="fa-regular fa-rectangle-list"></i></span> Mis leads
        </button>
        <button data-view="publicaciones" class="zp-menu-item active w-full text-left px-5 py-3 text-sm flex items-center gap-3">
          <span class="zp-menu-ico w-5 text-center"><i class="fa-solid fa-circle-check"></i></span> Publicaciones
        </button>
        <button data-view="productos" class="zp-menu-item w-full text-left px-5 py-3 text-sm flex items-center gap-3">
          <span class="zp-menu-ico w-5 text-center text-cc-g400"><i class="fa-regular fa-credit-card"></i></span> Productos y servicios
        </button>
        <button data-view="perfil" class="zp-menu-item w-full text-left px-5 py-3 text-sm flex items-center gap-3">
          <span class="zp-menu-ico w-5 text-center text-cc-g400"><i class="fa-solid fa-user"></i></span> Mis datos
        </button>
        <button data-view="facturacion" class="zp-menu-item w-full text-left px-5 py-3 text-sm flex items-center gap-3">
          <span class="zp-menu-ico w-5 text-center text-cc-g400"><i class="fa-regular fa-file-lines"></i></span> Datos Facturacion
        </button>

        <div class="mx-5 my-3 border-t border-cc-g200"></div>
        <button data-view="oficina-ia" class="zp-menu-item w-full text-left px-5 py-3 text-sm flex items-center gap-3">
          <span class="zp-menu-ico w-5 text-center text-cc-g400"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
          <span class="flex-1">Oficina Virtual IA</span>
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-cc-amber/20 text-cc-amber">IA</span>
        </button>
      </nav>
    </aside>

    <div id="backdrop" class="fixed inset-0 top-16 bg-black/40 z-10 hidden lg:hidden"></div>

    <!-- MAIN -->
    <main class="flex-1 min-w-0 px-4 md:px-6 py-6">
      <section id="view-publicaciones" class="view active"></section>
      <section id="view-leads" class="view"></section>
      <section id="view-reportes" class="view"></section>
      <section id="view-oficina-ia" class="view"></section>
      <section id="view-productos" class="view"></section>
      <section id="view-perfil" class="view"></section>
      <section id="view-facturacion" class="view"></section>
    </main>
  </div>

  <!-- pestana lateral fija "Resuelve tus dudas" -->
  <button class="hidden lg:flex fixed right-0 top-1/2 -translate-y-1/2 z-20 bg-cc-blueSoft text-cc-primary text-xs font-semibold px-2 py-3 rounded-l-lg shadow items-center">
    <span class="dudas-tab">Resuelve tus dudas</span>
  </button>

  <!-- toast host -->
  <div id="toastHost" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

  <script src="app-oficina-virtual.js?v=3"></script>
</body>
</html>
